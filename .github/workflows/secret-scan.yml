name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned scanner in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          tool_dir=$(mktemp -d "$RUNNER_TEMP/syn-gitleaks.XXXXXX")
          cd "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          echo "GITLEAKS_BINARY=$tool_dir/gitleaks" >> "$GITHUB_ENV"
      - name: Scan full history and proposed index without artifact uploads
        run: sh scripts/check-secrets.sh
      - name: Verify the scanner rejects staged and historical synthetic secrets
        run: python3 -m unittest scripts/tests/test_secret_scan.py
