name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: cargo fmt --all -- --check
      - run: cargo run --quiet -p syn-protocol --example golden_vectors > /tmp/protocol-v1.json
      - run: cmp tests/fixtures/protocol-v1.json /tmp/protocol-v1.json
      - run: cmp tests/fixtures/protocol-v1.json macos/Tests/SynTests/Fixtures/protocol-v1.json
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p syn-sudo-plugin --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo test --workspace

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path macos
