name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: cargo fmt --all -- --check
      - run: cargo run --quiet --locked -p syn-protocol --example golden_vectors > /tmp/protocol-v1.json
      - run: cmp tests/fixtures/protocol-v1.json /tmp/protocol-v1.json
      - run: cmp tests/fixtures/protocol-v1.json macos/Tests/SynTests/Fixtures/protocol-v1.json
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy -p syn-sudo-plugin --target aarch64-unknown-linux-gnu --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: python3 scripts/test-log-privacy.py

  macos:
    runs-on: macos-15
    env:
      # The runner's default Xcode 16.4 has Swift 6.1; Syn requires Swift 6.2.
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path macos -Xswiftc -warnings-as-errors
